[project]
name = "unbiastap"
version = "0.1.0"
description = "Package with a set of approaches to deal with postext of ranking systems."
authors = [
    {name = "Cesar Chalco",email = "cesarchalcoelias@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas (>=3.0.2,<4.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "xgboost (>=3.2.0,<4.0.0)",
    "shap (>=0.51.0,<0.52.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]

[tool.poetry]
packages = [{include = "unbiastap"}]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
extend-select = ["E501"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.8,<0.16.0)"
]
