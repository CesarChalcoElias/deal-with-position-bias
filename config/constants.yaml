general:
  random_seed: 42
  data_dir: "data"
  raw_file: "train.csv"

ranking:
  max_position: 38
  fold_position: 5

target:
  click_col: "click_bool"

features:
  columns:
    - "price_usd"
    - "prop_starrating"
    - "prop_review_score"
    - "prop_brand_bool"
    - "prop_location_score1"
    - "prop_location_score2"
    - "srch_adults_count"
    - "srch_children_count"
    - "srch_room_count"
    - "srch_length_of_stay"
    - "srch_booking_window"
    - "promotion_flag"

debiasing:
  ips:
    sequential_dropout: 0.9
